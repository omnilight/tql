# Pet API, OpenAPI 3.0.
openapi: "3.1.0"
info:
  title: Pet API
  version: 1.0.0
paths:
  /pets/{id}:
    get:
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: A pet
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Pet'
components:
  schemas:
    Pet:
      type: object
      required: [id, name]
      properties:
        id:
          type: integer
          format: int64
          exclusiveMinimum: 1 # > 1
        name:
          type: ["string","null"]
        tag:
          type: string
        score:
          type: number
          exclusiveMaximum: 100
    Error:
      type: object
      properties:
        message:
          type: ["string","null"]
