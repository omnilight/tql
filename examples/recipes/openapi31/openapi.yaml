# Pet API, OpenAPI 3.0.
openapi: 3.0.3
info:
  title: Pet API
  version: 1.0.0
paths:
  /pets/{id}:
    get:
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: A pet
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Pet'
components:
  schemas:
    Pet:
      type: object
      required: [id, name]
      properties:
        id:
          type: integer
          format: int64
          minimum: 1
          exclusiveMinimum: true # > 1
        name:
          type: string
          nullable: true
        tag:
          type: string
          nullable: false
        score:
          type: number
          maximum: 100
          exclusiveMaximum: true
    Error:
      type: object
      properties:
        message:
          type: string
          nullable: true
