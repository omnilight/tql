# golangci-lint v2 configuration, shared by local development and CI.
version: "2"

run:
  timeout: "5m" # CI needs enough time for the first, uncached analysis.
  tests: true

linters:
  default: standard
  enable:
    - bodyclose # Existing choices and their comments stay in place.
    - misspell
    - revive
    - gocritic
  settings:
    misspell:
      locale: US
